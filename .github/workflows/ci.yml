name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Kotlin core (engine + crypto protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        working-directory: android/core
        run: ../gradlew test --no-daemon

  backend:
    name: Supabase backend (Deno + Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        working-directory: supabase
        run: deno check functions/api/index.ts functions/play-rtdn/index.ts tests/*.ts
      - name: Edge function tests
        working-directory: supabase
        run: deno test --allow-read tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Database migration tests (PGlite)
        working-directory: supabase/tests/db
        run: npm ci && npm test

  android:
    name: Android app (lint + debug + release build)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        env:
          # Public values only. Without them the app builds in offline/practice mode.
          ARBOT_API_URL: ${{ vars.ARBOT_API_URL }}
          ARBOT_API_KEY_ID: ${{ vars.ARBOT_API_KEY_ID }}
          ARBOT_API_PUBLIC_KEY: ${{ vars.ARBOT_API_PUBLIC_KEY }}
          ARBOT_CERT_PINS: ${{ vars.ARBOT_CERT_PINS }}
          ARBOT_CLOUD_PROJECT_NUMBER: ${{ vars.ARBOT_CLOUD_PROJECT_NUMBER }}
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: arbot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
